[tool.pytest.ini_options]
# pythonpath = ["."] adiciona a pasta backend/ ao sys.path durante os testes.
# E isso que faz "from app.main import create_app" funcionar sem precisar
# instalar o projeto como pacote.
pythonpath = ["."]
testpaths = ["tests"]

# -v          lista cada teste pelo nome, em vez de imprimir apenas pontos.
#             Sem isso, "45 passed" nao permite verificar QUAIS testes rodaram:
#             se um arquivo sumir ou deixar de ser coletado, o numero muda e
#             ninguem percebe.
# --tb=short  em caso de falha, mostra o essencial em vez de paginas de pilha.
# -ra         resumo no fim com tudo que nao passou (falhas, erros, pulados).
addopts = "-v --tb=short -ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: erros e avisos de estilo (pycodestyle)
# F:   erros logicos (pyflakes) - variavel nao usada, import nao usado
# I:   ordenacao de imports (isort)
# B:   armadilhas comuns (flake8-bugbear)
# UP:  sintaxe moderna de Python (pyupgrade)
select = ["E", "W", "F", "I", "B", "UP"]
